add_field:
  fields:
    name:
      required: true
      selector:
        text:
    type:
      required: true
      selector:
        select:
          translation_key: field_type
          options: [text, long_text, date, number, boolean, link, matter_code]
    scope:
      default: picked
      selector:
        select:
          translation_key: scope
          options: [all, integrations, picked]
    integrations:
      example: "matter"
      selector:
        text:
          multiple: true
